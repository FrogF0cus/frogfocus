<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Project | Project Hub</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a25;
      --accent: #6366f1;
      --accent-secondary: #a855f7;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #1e293b;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .bg-gradient {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        var(--bg-dark);
      z-index: -1;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    header {
      text-align: center;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .project-icon { font-size: 3rem; margin-bottom: 1rem; }

    .project-title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .project-type {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .project-description {
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .quick-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border: none;
    }

    .section { margin-bottom: 2.5rem; }

    .section h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .file-card {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }

    .file-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .file-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .file-name { font-weight: 500; word-break: break-word; }
    .file-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .more-files { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem; }

    .decisions-section {
      background: var(--bg-card);
      border: 1px solid var(--warning);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .decisions-section h3 {
      color: var(--warning);
      margin-bottom: 1rem;
    }

    .decision-list { display: flex; flex-direction: column; gap: 1rem; }

    .decision-card {
      padding: 1rem;
      background: var(--bg-dark);
      border-radius: 8px;
      border-left: 3px solid var(--warning);
    }

    .decision-card.priority-high { border-left-color: var(--danger); }
    .decision-card.priority-low { border-left-color: var(--text-muted); }

    .decision-question { font-weight: 500; margin-bottom: 0.5rem; }

    .decision-options { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }

    .option {
      padding: 0.25rem 0.75rem;
      background: var(--bg-card);
      border-radius: 4px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .decision-meta { font-size: 0.75rem; color: var(--text-muted); }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .metadata-item {
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 8px;
    }

    .metadata-key { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .metadata-value { font-weight: 500; margin-top: 0.25rem; }

    /* Type-specific sections */
    .type-specific {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .type-specific h3 {
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      text-align: center;
      padding: 1rem;
      background: var(--bg-dark);
      border-radius: 8px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .api-info code {
      background: var(--bg-dark);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      color: var(--accent);
    }

    .api-docs {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .file-link {
      display: inline-block;
      margin-right: 1rem;
      color: var(--accent);
      text-decoration: none;
    }

    .file-link:hover { text-decoration: underline; }

    .research-summary {
      color: var(--text-secondary);
    }

    .muted { color: var(--text-muted); font-style: italic; }

    .store-info p {
      margin-bottom: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .live-preview-wrap {
      margin-bottom: 2rem;
    }
    .preview-tabs {
      display: flex; gap: 4px; margin-bottom: 0.5rem; overflow-x: auto;
    }
    .preview-tab {
      padding: 0.4rem 0.75rem; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px 6px 0 0; color: var(--text-muted); font-size: 0.75rem;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .preview-tab.active, .preview-tab:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .preview-frame {
      width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 0 8px 8px 8px;
      background: #fff;
    }
    .two-col { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; }
    .sidebar-panel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.25rem; height: fit-content;
    }
    .sidebar-panel h3 { font-size: 0.85rem; margin-bottom: 0.75rem; }
    .sidebar-panel h3.warning { color: #eab308; }
    .quick-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .qs-card { text-align: center; padding: 0.75rem; background: rgba(99,102,241,0.06); border-radius: 8px; }
    .qs-val { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .qs-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
    .decision-card-sm {
      padding: 0.6rem; background: rgba(234,179,8,0.06); border-left: 3px solid #eab308;
      border-radius: 0 6px 6px 0; margin-bottom: 0.5rem; font-size: 0.75rem; color: var(--text-secondary);
    }
    .all-files-list { list-style: none; padding: 0; }
    .all-files-list li {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem;
    }
    .all-files-list li:last-child { border-bottom: none; }
    .all-files-list a { color: var(--accent); text-decoration: none; }
    .all-files-list a:hover { text-decoration: underline; }
    .all-files-list .file-size { color: var(--text-muted); font-size: 0.7rem; margin-left: auto; }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .project-title { font-size: 1.75rem; }
      .quick-actions { flex-direction: column; }
      .file-grid { grid-template-columns: 1fr; }
      .preview-frame { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="container">
    <header>
      <a href="/workspace/projects/" style="color:var(--text-muted);text-decoration:none;font-size:0.8rem;">← Back to Project Hub</a>
      <div class="project-icon">📊</div>
      <h1 class="project-title">New Project</h1>
      <div class="project-type">general</div>
      
      <div class="quick-actions">
        <a href="/workspace/projects/" class="action-btn">← All Projects</a>
      </div>
    </header>

    <div class="two-col">
      <div class="main-content">
        

        

        

        
        
        
        

        
      </div>

      <div class="sidebar">
        <div class="sidebar-panel">
          <h3>📊 Quick Stats</h3>
          <div class="quick-stat-grid">
            <div class="qs-card"><div class="qs-val">0</div><div class="qs-label">Files</div></div>
            <div class="qs-card"><div class="qs-val">0</div><div class="qs-label">Pages</div></div>
            <div class="qs-card"><div class="qs-val">0</div><div class="qs-label">Code</div></div>
            <div class="qs-card"><div class="qs-val">0</div><div class="qs-label">Decisions</div></div>
          </div>
        </div>

        

        <div class="sidebar-panel" style="margin-top:1rem;">
          <h3>📁 All Files</h3>
          <ul class="all-files-list">
            
            <li style="color:var(--text-muted);">No files yet</li>
          </ul>
        </div>
      </div>
    </div>

    <footer>
      <p>Project Hub • Generated by Empir3</p>
    </footer>
  </div>
  <script>
    function switchPreview(url, btn) {
      document.getElementById('preview-iframe').src = url;
      document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
