<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Frog Focus mascot</title>
  <desc>Hand-built flat vector frog mascot: sage green head and chest, gold-rimmed glasses, cream belly, subtle blush, gentle smile. Built from clean beziers, circles and ellipses — mathematically smooth at any size.</desc>

  <!-- ============ PALETTE (sampled from images/icon-512.png + apple-touch-icon.png) ============
       body green   #5C8A6E  (sampled #5B886D family)
       outline      #403A34  (dark warm contour, sampled #40373A family)
       belly cream  #F9EDD5  (sampled)
       belly shade  #E7DBC3  (inner shadow line, sampled #E3D7BD family)
       lens cream   #F8D798  (eye white through the glass, sampled)
       rim gold     #D9A441  (warm ochre-gold, sampled #D59B42/#C7A346 family)
       pupil        #3A3226  (deep charcoal-brown, brand)
       blush        #EFC0AC  (soft dusty pink, sampled blend #DEA690/#E8B6A9)
       ========================================================================================= -->

  <defs>
    <path id="belly"
      d="M 310 572
         C 306 552, 392 546, 512 620
         C 632 546, 718 552, 714 572
         C 728 690, 730 810, 720 872
         C 712 902, 634 916, 512 912
         C 390 916, 312 902, 304 872
         C 294 810, 296 690, 310 572
         Z"/>
    <clipPath id="bellyClip">
      <use href="#belly"/>
    </clipPath>
  </defs>

  <!-- full-bleed white background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- frog silhouette: head + chest from the chest up, two eye-dome bumps on top -->
  <path
    d="M 512 410
       C 502 356, 442 330, 348 330
       C 294 330, 266 366, 260 420
       C 254 490, 232 600, 196 706
       C 172 770, 216 784, 256 784
       C 262 784, 250 826, 238 856
       C 230 888, 252 916, 292 920
       C 352 924, 432 934, 512 934
       C 592 934, 672 924, 732 920
       C 772 916, 794 888, 786 856
       C 774 826, 762 784, 768 784
       C 808 784, 852 770, 828 706
       C 792 600, 770 490, 764 420
       C 758 366, 730 330, 676 330
       C 582 330, 522 356, 512 410
       Z"
    fill="#5C8A6E"
    stroke="#403A34"
    stroke-width="11"
    stroke-linejoin="round"/>

  <!-- cream belly (chest patch) -->
  <use href="#belly" fill="#F9EDD5"/>
  <!-- soft inner shadow line where the belly meets the green -->
  <g clip-path="url(#bellyClip)">
    <use href="#belly" fill="none" stroke="#E7DBC3" stroke-width="12" opacity="0.9"/>
  </g>

  <!-- subtle pink blush cheeks -->
  <ellipse cx="298" cy="530" rx="36" ry="24" fill="#EFC0AC" transform="rotate(-12 298 530)"/>
  <ellipse cx="726" cy="530" rx="36" ry="24" fill="#EFC0AC" transform="rotate(12 726 530)"/>

  <!-- eye whites visible through the glasses -->
  <circle cx="352" cy="440" r="82" fill="#F8D798"/>
  <circle cx="672" cy="440" r="82" fill="#F8D798"/>

  <!-- pupils (slightly lower-inner) -->
  <ellipse cx="360" cy="454" rx="38" ry="34" fill="#3A3226"/>
  <ellipse cx="664" cy="454" rx="38" ry="34" fill="#3A3226"/>

  <!-- eye glints (upper-outer) -->
  <ellipse cx="342" cy="432" rx="14" ry="9" fill="#FFFFFF" transform="rotate(-18 342 432)"/>
  <ellipse cx="682" cy="432" rx="14" ry="9" fill="#FFFFFF" transform="rotate(18 682 432)"/>

  <!-- warm gold-rimmed round glasses -->
  <circle cx="352" cy="440" r="82" fill="none" stroke="#D9A441" stroke-width="16"/>
  <circle cx="672" cy="440" r="82" fill="none" stroke="#D9A441" stroke-width="16"/>

  <!-- straight bridge between the lenses -->
  <path d="M 436 462 L 588 462" fill="none" stroke="#D9A441" stroke-width="9" stroke-linecap="round"/>

  <!-- temple arms -->
  <path d="M 268 438 L 234 430" fill="none" stroke="#D9A441" stroke-width="9" stroke-linecap="round"/>
  <path d="M 756 438 L 790 430" fill="none" stroke="#D9A441" stroke-width="9" stroke-linecap="round"/>

  <!-- gentle smile (wide, shallow, corners up) on the chin -->
  <path d="M 404 552 Q 512 580 620 552" fill="none" stroke="#403A34" stroke-width="18" stroke-linecap="round"/>

  <!-- short content line below the smile, on the belly -->
  <path d="M 484 648 L 540 648" fill="none" stroke="#403A34" stroke-width="9" stroke-linecap="round"/>
</svg>
