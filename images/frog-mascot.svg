<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Frog Focus mascot</title>
  <desc>Hand-built flat vector frog mascot: sage green head and chest, gold-rimmed glasses, cream belly, subtle blush, gentle smile. Built from clean beziers, circles and ellipses — mathematically smooth at any size.</desc>

  <!-- ============ PALETTE (sampled from images/icon-512.png + apple-touch-icon.png) ============
       body green   #5C8A6E  (sampled #5B886D family)
       outline      #403A34  (dark warm contour, sampled #40373A family)
       belly cream  #F9EDD5  (sampled)
       belly shade  #E7DBC3  (inner shadow line, sampled #E3D7BD family)
       lens cream   #F8D798  (eye white through the glass, sampled)
       rim gold     #D9A441  (warm ochre-gold, sampled #D59B42/#C7A346 family)
       pupil        #3A3226  (deep charcoal-brown, brand)
       blush        #EFC0AC  (soft dusty pink, sampled blend #DEA690/#E8B6A9)
       ========================================================================================= -->

  <defs>
    <path id="belly"
      d="M 286 596
         C 300 572, 384 566, 512 636
         C 640 566, 724 572, 738 596
         C 750 700, 752 800, 742 868
         C 734 900, 642 918, 512 912
         C 382 918, 290 900, 282 868
         C 272 800, 274 700, 286 596
         Z"/>
    <clipPath id="bellyClip">
      <use href="#belly"/>
    </clipPath>
  </defs>

  <!-- full-bleed white background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- frog silhouette: head + chest from the chest up, two eye-dome bumps on top -->
  <path
    d="M 512 424
       C 502 368, 442 350, 348 350
       C 292 350, 262 384, 256 436
       C 250 500, 224 620, 180 760
       C 152 830, 210 838, 258 830
       C 268 826, 252 862, 238 884
       C 222 906, 228 926, 280 928
       C 348 932, 436 940, 512 940
       C 588 940, 676 932, 744 928
       C 796 926, 802 906, 786 884
       C 772 862, 756 826, 766 830
       C 814 838, 872 830, 844 760
       C 800 620, 774 500, 768 436
       C 762 384, 732 350, 676 350
       C 582 350, 522 368, 512 424
       Z"
    fill="#5C8A6E"
    stroke="#403A34"
    stroke-width="14"
    stroke-linejoin="round"/>

  <!-- cream belly (chest patch) -->
  <use href="#belly" fill="#F9EDD5"/>
  <!-- soft inner shadow line where the belly meets the green -->
  <g clip-path="url(#bellyClip)">
    <use href="#belly" fill="none" stroke="#E7DBC3" stroke-width="14" opacity="0.9"/>
  </g>

  <!-- subtle pink blush cheeks -->
  <ellipse cx="298" cy="522" rx="42" ry="28" fill="#EFC0AC" transform="rotate(-12 298 522)"/>
  <ellipse cx="726" cy="522" rx="42" ry="28" fill="#EFC0AC" transform="rotate(12 726 522)"/>

  <!-- eye whites visible through the glasses -->
  <circle cx="352" cy="440" r="88" fill="#F8D798"/>
  <circle cx="672" cy="440" r="88" fill="#F8D798"/>

  <!-- pupils (slightly lower-inner) -->
  <ellipse cx="360" cy="454" rx="42" ry="38" fill="#3A3226"/>
  <ellipse cx="664" cy="454" rx="42" ry="38" fill="#3A3226"/>

  <!-- eye glints (upper-outer) -->
  <ellipse cx="340" cy="430" rx="15" ry="10" fill="#FFFFFF" transform="rotate(-18 340 430)"/>
  <ellipse cx="684" cy="430" rx="15" ry="10" fill="#FFFFFF" transform="rotate(18 684 430)"/>

  <!-- warm gold-rimmed round glasses -->
  <circle cx="352" cy="440" r="88" fill="none" stroke="#D9A441" stroke-width="17"/>
  <circle cx="672" cy="440" r="88" fill="none" stroke="#D9A441" stroke-width="17"/>

  <!-- bridge between the lenses -->
  <path d="M 440 462 Q 512 474 584 462" fill="none" stroke="#D9A441" stroke-width="11" stroke-linecap="round"/>

  <!-- temple arms -->
  <path d="M 262 438 L 224 430" fill="none" stroke="#D9A441" stroke-width="11" stroke-linecap="round"/>
  <path d="M 762 438 L 800 430" fill="none" stroke="#D9A441" stroke-width="11" stroke-linecap="round"/>

  <!-- gentle smile (wide, shallow, corners up) on the chin -->
  <path d="M 414 570 Q 512 598 610 570" fill="none" stroke="#403A34" stroke-width="20" stroke-linecap="round"/>

  <!-- short content line below the smile, on the belly -->
  <path d="M 480 660 L 544 660" fill="none" stroke="#403A34" stroke-width="11" stroke-linecap="round"/>
</svg>
