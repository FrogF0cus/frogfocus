<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Frog Focus mascot</title>
  <desc>Hand-built flat vector frog mascot: sage green head and chest, gold-rimmed glasses, cream belly, subtle blush, gentle smile. Built from clean beziers, circles and ellipses — mathematically smooth at any size.</desc>

  <!-- ============ PALETTE (sampled from images/icon-512.png + apple-touch-icon.png) ============
       body green   #5C8A6E  (sampled #5B886D family)
       outline      #403A34  (dark warm contour, sampled #40373A family)
       belly cream  #F9EDD5  (sampled)
       belly shade  #E7DBC3  (inner shadow line, sampled #E3D7BD family)
       lens cream   #F8D798  (eye white through the glass, sampled)
       rim gold     #D9A441  (warm ochre-gold, sampled #D59B42/#C7A346 family)
       pupil        #3A3226  (deep charcoal-brown, brand)
       blush        #EFC0AC  (soft dusty pink, sampled blend #DEA690/#E8B6A9)
       ========================================================================================= -->

  <defs>
    <path id="belly"
      d="M 302 604
         C 296 580, 384 570, 512 652
         C 640 570, 728 580, 722 604
         C 738 720, 742 830, 730 874
         C 724 902, 636 918, 512 912
         C 388 918, 300 902, 294 874
         C 282 830, 286 720, 302 604
         Z"/>
    <clipPath id="bellyClip">
      <use href="#belly"/>
    </clipPath>
  </defs>

  <!-- full-bleed white background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- frog silhouette: head + chest from the chest up, two eye-dome bumps on top -->
  <path
    d="M 512 392
       C 498 328, 440 300, 348 300
       C 292 300, 258 340, 254 396
       C 250 470, 222 600, 200 740
       C 186 790, 214 802, 250 806
       C 260 808, 246 846, 226 872
       C 208 898, 216 920, 270 922
       C 340 926, 430 936, 512 936
       C 594 936, 684 926, 754 922
       C 808 920, 816 898, 798 872
       C 778 846, 764 808, 774 806
       C 810 802, 838 790, 824 740
       C 802 600, 774 470, 770 396
       C 766 340, 732 300, 676 300
       C 584 300, 526 328, 512 392
       Z"
    fill="#5C8A6E"
    stroke="#403A34"
    stroke-width="14"
    stroke-linejoin="round"/>

  <!-- cream belly (chest patch) -->
  <use href="#belly" fill="#F9EDD5"/>
  <!-- soft inner shadow line where the belly meets the green -->
  <g clip-path="url(#bellyClip)">
    <use href="#belly" fill="none" stroke="#E7DBC3" stroke-width="14" opacity="0.9"/>
  </g>

  <!-- subtle pink blush cheeks -->
  <ellipse cx="296" cy="522" rx="44" ry="30" fill="#EFC0AC" transform="rotate(-12 296 522)"/>
  <ellipse cx="728" cy="522" rx="44" ry="30" fill="#EFC0AC" transform="rotate(12 728 522)"/>

  <!-- eye whites visible through the glasses -->
  <circle cx="352" cy="440" r="96" fill="#F8D798"/>
  <circle cx="672" cy="440" r="96" fill="#F8D798"/>

  <!-- pupils (slightly lower-inner) -->
  <ellipse cx="360" cy="456" rx="50" ry="44" fill="#3A3226"/>
  <ellipse cx="664" cy="456" rx="50" ry="44" fill="#3A3226"/>

  <!-- eye glints (upper-outer) -->
  <ellipse cx="336" cy="424" rx="18" ry="11" fill="#FFFFFF" transform="rotate(-18 336 424)"/>
  <ellipse cx="688" cy="424" rx="18" ry="11" fill="#FFFFFF" transform="rotate(18 688 424)"/>

  <!-- warm gold-rimmed round glasses -->
  <circle cx="352" cy="440" r="96" fill="none" stroke="#D9A441" stroke-width="18"/>
  <circle cx="672" cy="440" r="96" fill="none" stroke="#D9A441" stroke-width="18"/>

  <!-- bridge between the lenses -->
  <path d="M 448 462 Q 512 476 576 462" fill="none" stroke="#D9A441" stroke-width="13" stroke-linecap="round"/>

  <!-- temple arms -->
  <path d="M 256 440 L 208 432" fill="none" stroke="#D9A441" stroke-width="13" stroke-linecap="round"/>
  <path d="M 768 440 L 816 432" fill="none" stroke="#D9A441" stroke-width="13" stroke-linecap="round"/>

  <!-- gentle smile (wide, shallow, corners up) on the chin -->
  <path d="M 402 614 Q 512 646 622 614" fill="none" stroke="#403A34" stroke-width="22" stroke-linecap="round"/>

  <!-- short content line below the smile, on the belly -->
  <path d="M 480 676 L 544 676" fill="none" stroke="#403A34" stroke-width="12" stroke-linecap="round"/>
</svg>
